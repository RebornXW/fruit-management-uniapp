<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 水果档口库存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body data-page="profile" class="bg-gray-100 h-screen flex flex-col">
    <!-- 状态栏 -->
    <div id="status-bar"></div>
    
    <!-- 用户信息头部 -->
    <div class="bg-teal-600 text-white p-4 pb-16">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold">个人中心</h1>
            <div class="flex items-center space-x-3">
                <i class="fas fa-cog"></i>
            </div>
        </div>
        
        <div class="mt-6 flex items-center">
            <div class="relative">
                <div class="w-16 h-16 bg-white rounded-full overflow-hidden border-2 border-white">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="用户头像" class="w-full h-full object-cover">
                </div>
                <div class="absolute bottom-0 right-0 w-5 h-5 bg-green-400 border-2 border-white rounded-full"></div>
            </div>
            <div class="ml-4">
                <h2 class="text-lg font-bold">张店长</h2>
                <p class="text-sm opacity-80">蔬果档口经营者</p>
            </div>
        </div>
    </div>
    
    <!-- 销售数据统计卡片 -->
    <div class="px-4 -mt-12 mb-4">
        <div class="bg-white rounded-2xl shadow-lg p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-gray-800">销售数据统计</h3>
                <div class="text-sm">
                    <span class="text-teal-600 font-medium">本周</span>
                    <i class="fas fa-chevron-down ml-1 text-gray-500"></i>
                </div>
            </div>
            
            <!-- 销售数据可视化 -->
            <div class="h-48 mb-4">
                <canvas id="salesChart"></canvas>
            </div>
            
            <!-- 销售指标 -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-teal-50 rounded-lg p-3 text-center">
                    <p class="text-sm text-gray-500">销售总额</p>
                    <p class="text-xl font-bold text-teal-600">¥8,356</p>
                    <p class="text-xs text-green-500 mt-1">
                        <i class="fas fa-arrow-up"></i> 12.5%
                    </p>
                </div>
                <div class="bg-teal-50 rounded-lg p-3 text-center">
                    <p class="text-sm text-gray-500">销售量</p>
                    <p class="text-xl font-bold text-teal-600">156箱</p>
                    <p class="text-xs text-green-500 mt-1">
                        <i class="fas fa-arrow-up"></i> 8.2%
                    </p>
                </div>
                <div class="bg-teal-50 rounded-lg p-3 text-center">
                    <p class="text-sm text-gray-500">客户数</p>
                    <p class="text-xl font-bold text-teal-600">56</p>
                    <p class="text-xs text-red-500 mt-1">
                        <i class="fas fa-arrow-down"></i> 3.1%
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 功能项 -->
    <div class="px-4 mb-2">
        <div class="bg-white rounded-xl overflow-hidden shadow-sm">
            <div class="grid grid-cols-4 text-center">
                <div class="p-4" id="sales-record-btn">
                    <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto">
                        <i class="fas fa-file-invoice"></i>
                    </div>
                    <p class="text-sm mt-2">销售记录</p>
                </div>
                <div class="p-4" id="purchase-record-btn">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    <p class="text-sm mt-2">进货记录</p>
                </div>
                <div class="p-4" id="data-analysis-btn">
                    <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <p class="text-sm mt-2">数据分析</p>
                </div>
                <div class="p-4" id="customer-btn">
                    <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto">
                        <i class="fas fa-users"></i>
                    </div>
                    <p class="text-sm mt-2">客户管理</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 热销水果排行 -->
    <div class="px-4 mb-4">
        <h3 class="text-base font-bold mb-2">热销水果排行</h3>
        <div class="bg-white rounded-xl p-4 shadow-sm">
            <table class="w-full">
                <tbody>
                    <!-- 排行项 1 -->
                    <tr class="border-b border-gray-100">
                        <td class="py-3 pl-1 pr-4 flex items-center">
                            <div class="w-6 h-6 bg-yellow-400 text-white rounded-full flex items-center justify-center mr-3 text-xs font-bold">1</div>
                            <div class="w-10 h-10 bg-gray-200 rounded overflow-hidden mr-3">
                                <img src="https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?q=80&w=300" alt="苹果" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <p class="font-medium">明牌阿克苏苹果</p>
                                <p class="text-xs text-gray-500">销量：52箱</p>
                            </div>
                        </td>
                        <td class="py-3 text-right text-teal-600 font-bold">¥2,860</td>
                    </tr>
                    
                    <!-- 排行项 2 -->
                    <tr class="border-b border-gray-100">
                        <td class="py-3 pl-1 pr-4 flex items-center">
                            <div class="w-6 h-6 bg-gray-300 text-white rounded-full flex items-center justify-center mr-3 text-xs font-bold">2</div>
                            <div class="w-10 h-10 bg-gray-200 rounded overflow-hidden mr-3">
                                <img src="https://images.unsplash.com/photo-1594502184342-2349ffc9ead3?q=80&w=300" alt="梨子" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <p class="font-medium">砀山梨</p>
                                <p class="text-xs text-gray-500">销量：38箱</p>
                            </div>
                        </td>
                        <td class="py-3 text-right text-teal-600 font-bold">¥1,216</td>
                    </tr>
                    
                    <!-- 排行项 3 -->
                    <tr>
                        <td class="py-3 pl-1 pr-4 flex items-center">
                            <div class="w-6 h-6 bg-orange-400 text-white rounded-full flex items-center justify-center mr-3 text-xs font-bold">3</div>
                            <div class="w-10 h-10 bg-gray-200 rounded overflow-hidden mr-3">
                                <img src="https://images.unsplash.com/photo-1519096989031-2aee4ffe17c6?q=80&w=300" alt="橘子" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <p class="font-medium">新鲜橘子</p>
                                <p class="text-xs text-gray-500">销量：25箱</p>
                            </div>
                        </td>
                        <td class="py-3 text-right text-teal-600 font-bold">¥750</td>
                    </tr>
                </tbody>
            </table>
            <div class="mt-3 text-center">
                <button class="text-sm text-teal-600">
                    查看完整排行 <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 底部导航栏 -->
    <div id="tab-bar"></div>
    
    <!-- 功能模态弹窗 -->
    <div id="function-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl w-4/5 max-h-3/4 overflow-y-auto p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-xl font-bold"></h2>
                <button onclick="hideModal()" class="text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-content">
                <!-- 动态内容区域 -->
            </div>
            <div class="mt-4 text-center">
                <button onclick="hideModal()" class="w-full bg-teal-600 text-white py-2 rounded-lg">
                    关闭
                </button>
            </div>
        </div>
    </div>
    
    <script src="components.js"></script>
    <script>
        // 销售数据图表
        const ctx = document.getElementById('salesChart').getContext('2d');
        const salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '销售额',
                    data: [850, 1200, 950, 1800, 1250, 1650, 1400],
                    backgroundColor: 'rgba(13, 148, 136, 0.1)',
                    borderColor: 'rgba(13, 148, 136, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: 'rgba(13, 148, 136, 1)',
                    pointRadius: 4,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            drawBorder: false,
                            color: 'rgba(200, 200, 200, 0.2)'
                        },
                        ticks: {
                            callback: function(value) {
                                return '¥' + value;
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return '销售额: ¥' + context.parsed.y;
                            }
                        }
                    }
                }
            }
        });
        
        // 功能按钮点击事件
        document.getElementById('sales-record-btn').addEventListener('click', function() {
            showModal('销售记录', `
                <div class="space-y-3">
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-medium">明牌阿克苏苹果</p>
                                <p class="text-xs text-gray-500">2箱 × ¥55.00</p>
                                <p class="text-xs text-gray-400">2025-04-04 09:41</p>
                            </div>
                            <p class="font-bold text-teal-600">¥110.00</p>
                        </div>
                    </div>
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-medium">砀山梨</p>
                                <p class="text-xs text-gray-500">3箱 × ¥32.00</p>
                                <p class="text-xs text-gray-400">2025-04-04 09:28</p>
                            </div>
                            <p class="font-bold text-teal-600">¥96.00</p>
                        </div>
                    </div>
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-medium">红富士苹果</p>
                                <p class="text-xs text-gray-500">5箱 × ¥48.00</p>
                                <p class="text-xs text-gray-400">2025-04-04 09:15</p>
                            </div>
                            <p class="font-bold text-teal-600">¥240.00</p>
                        </div>
                    </div>
                    <div class="pb-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-medium">新鲜橘子</p>
                                <p class="text-xs text-gray-500">4箱 × ¥28.00</p>
                                <p class="text-xs text-gray-400">2025-04-04 08:52</p>
                            </div>
                            <p class="font-bold text-teal-600">¥112.00</p>
                        </div>
                    </div>
                </div>
            `);
        });
        
        document.getElementById('purchase-record-btn').addEventListener('click', function() {
            showModal('进货记录', `
                <div class="space-y-3">
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-medium">红富士苹果</p>
                                <p class="text-xs text-gray-500">15箱 × ¥35.00</p>
                                <p class="text-xs text-gray-400">2025-04-03 07:30</p>
                            </div>
                            <p class="font-bold text-red-500">¥525.00</p>
                        </div>
                    </div>
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-medium">明牌阿克苏苹果</p>
                                <p class="text-xs text-gray-500">20箱 × ¥42.00</p>
                                <p class="text-xs text-gray-400">2025-04-02 08:15</p>
                            </div>
                            <p class="font-bold text-red-500">¥840.00</p>
                        </div>
                    </div>
                    <div class="pb-3">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-medium">新鲜橘子</p>
                                <p class="text-xs text-gray-500">10箱 × ¥20.00</p>
                                <p class="text-xs text-gray-400">2025-04-01 07:45</p>
                            </div>
                            <p class="font-bold text-red-500">¥200.00</p>
                        </div>
                    </div>
                </div>
            `);
        });
        
        document.getElementById('data-analysis-btn').addEventListener('click', function() {
            showModal('数据分析', `
                <div class="space-y-4">
                    <div class="bg-yellow-50 p-3 rounded-lg">
                        <h3 class="font-medium text-sm mb-2">销售趋势</h3>
                        <div class="h-40">
                            <canvas id="analysisChart"></canvas>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3 bg-teal-50 rounded-lg">
                            <p class="text-sm text-gray-500">销量TOP1</p>
                            <p class="text-base font-bold text-teal-600">明牌阿克苏苹果</p>
                            <p class="text-xs text-teal-600 mt-1">占总销量的28.5%</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg">
                            <p class="text-sm text-gray-500">销售额TOP1</p>
                            <p class="text-base font-bold text-blue-600">明牌阿克苏苹果</p>
                            <p class="text-xs text-blue-600 mt-1">占总销售额的33.4%</p>
                        </div>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <h3 class="font-medium text-sm mb-2">销售渠道分析</h3>
                        <div class="flex justify-between items-center">
                            <p class="text-sm">线下零售</p>
                            <div class="flex items-center">
                                <div class="w-24 h-2 bg-gray-200 rounded-full mr-2">
                                    <div class="h-2 bg-teal-600 rounded-full" style="width: 65%"></div>
                                </div>
                                <p class="text-xs font-medium">65%</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <p class="text-sm">批发订单</p>
                            <div class="flex items-center">
                                <div class="w-24 h-2 bg-gray-200 rounded-full mr-2">
                                    <div class="h-2 bg-blue-600 rounded-full" style="width: 25%"></div>
                                </div>
                                <p class="text-xs font-medium">25%</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <p class="text-sm">线上订单</p>
                            <div class="flex items-center">
                                <div class="w-24 h-2 bg-gray-200 rounded-full mr-2">
                                    <div class="h-2 bg-yellow-600 rounded-full" style="width: 10%"></div>
                                </div>
                                <p class="text-xs font-medium">10%</p>
                            </div>
                        </div>
                    </div>
                </div>
            `);
            
            // 创建数据分析图表
            setTimeout(() => {
                const chartCanvas = document.getElementById('analysisChart');
                if (chartCanvas) {
                    new Chart(chartCanvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: ['苹果', '梨子', '橘子', '西瓜', '香蕉'],
                            datasets: [{
                                label: '销量(箱)',
                                data: [52, 38, 25, 14, 10],
                                backgroundColor: [
                                    'rgba(13, 148, 136, 0.6)',
                                    'rgba(59, 130, 246, 0.6)',
                                    'rgba(249, 115, 22, 0.6)',
                                    'rgba(16, 185, 129, 0.6)',
                                    'rgba(234, 179, 8, 0.6)'
                                ],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: {
                                        display: false
                                    }
                                },
                                x: {
                                    grid: {
                                        display: false
                                    }
                                }
                            }
                        }
                    });
                }
            }, 100);
        });
        
        document.getElementById('customer-btn').addEventListener('click', function() {
            showModal('客户管理', `
                <div class="space-y-3">
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 mr-3">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <p class="font-medium">王小二</p>
                                <p class="text-xs text-gray-500">联系电话: 138****8765</p>
                            </div>
                            <div class="ml-auto text-right">
                                <p class="text-sm font-bold text-teal-600">消费¥1,258</p>
                                <p class="text-xs text-gray-500">近30天</p>
                            </div>
                        </div>
                    </div>
                    <div class="border-b border-gray-100 pb-3">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600 mr-3">
                                <i class="fas fa-store"></i>
                            </div>
                            <div>
                                <p class="font-medium">张水果店</p>
                                <p class="text-xs text-gray-500">联系电话: 137****4321</p>
                            </div>
                            <div class="ml-auto text-right">
                                <p class="text-sm font-bold text-teal-600">消费¥3,562</p>
                                <p class="text-xs text-gray-500">近30天</p>
                            </div>
                        </div>
                    </div>
                    <div class="pb-3">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 mr-3">
                                <i class="fas fa-building"></i>
                            </div>
                            <div>
                                <p class="font-medium">餐厅配送中心</p>
                                <p class="text-xs text-gray-500">联系电话: 136****9876</p>
                            </div>
                            <div class="ml-auto text-right">
                                <p class="text-sm font-bold text-teal-600">消费¥5,824</p>
                                <p class="text-xs text-gray-500">近30天</p>
                            </div>
                        </div>
                    </div>
                    <div class="pt-2">
                        <button class="w-full border border-teal-600 text-teal-600 py-2 rounded-lg flex items-center justify-center">
                            <i class="fas fa-plus mr-1"></i> 添加新客户
                        </button>
                    </div>
                </div>
            `);
        });
        
        // 显示模态弹窗
        function showModal(title, content) {
            const modal = document.getElementById('function-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = content;
            modal.classList.remove('hidden');
        }
        
        // 隐藏模态弹窗
        function hideModal() {
            document.getElementById('function-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
