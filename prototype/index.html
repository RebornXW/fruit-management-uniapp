<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果档口库存管理小程序 - 原型设计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .phone-container {
            width: 390px;
            height: 844px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin: 20px;
        }
        .phone-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-teal-700">水果档口库存管理小程序 - 原型设计</h1>
        
        <div class="flex flex-wrap justify-center">
            <!-- 今日报价页面 -->
            <div class="phone-container">
                <iframe src="price.html" class="phone-frame"></iframe>
                <p class="text-center mt-2 font-medium">今日报价</p>
            </div>
            
            <!-- 库存管理页面 -->
            <div class="phone-container">
                <iframe src="inventory.html" class="phone-frame"></iframe>
                <p class="text-center mt-2 font-medium">库存管理</p>
            </div>
            
            <!-- 水果销售页面 -->
            <div class="phone-container">
                <iframe src="sales.html" class="phone-frame"></iframe>
                <p class="text-center mt-2 font-medium">水果销售</p>
            </div>
            
            <!-- 个人中心页面 -->
            <div class="phone-container">
                <iframe src="profile.html" class="phone-frame"></iframe>
                <p class="text-center mt-2 font-medium">个人中心</p>
            </div>
        </div>
    </div>
</body>
</html>
